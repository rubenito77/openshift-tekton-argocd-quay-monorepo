apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-demo-ci
  namespace: monorepo-cicd
  labels:
    app.kubernetes.io/name: app-demo
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: monorepo-lab
spec:
  description: Prueba, publica una imagen inmutable y actualiza el manifiesto GitOps.
  params:
    - name: GIT_URL
      type: string
      default: https://github.com/rubenito77/openshift-tekton-argocd-quay-monorepo.git
    - name: GIT_REVISION
      type: string
      default: main
    - name: IMAGE_REPOSITORY
      type: string
      default: quay-rrkn9.apps.cluster-rrkn9.rrkn9.sandbox449.opentlc.com/monorepo-lab/app-demo
    - name: APP_VERSION
      type: string
      default: 0.1.0
    - name: GIT_REPOSITORY_SSH
      type: string
      default: git@github.com:rubenito77/openshift-tekton-argocd-quay-monorepo.git
    - name: GIT_BRANCH
      type: string
      default: main
  workspaces:
    - name: shared-workspace
      description: Código fuente compartido entre las Tasks.
    - name: dockerconfig
      description: Credenciales para publicar la imagen en Quay.
    - name: git-credentials
      description: Deploy key SSH para actualizar el repositorio GitOps.
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: namespace
            value: openshift-pipelines
          - name: name
            value: git-clone
      params:
        - name: URL
          value: $(params.GIT_URL)
        - name: REVISION
          value: $(params.GIT_REVISION)
        - name: DELETE_EXISTING
          value: "true"
        - name: DEPTH
          value: "1"
        - name: SUBMODULES
          value: "false"
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: test
      runAfter:
        - clone
      taskRef:
        name: python-tests
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build-and-push
      runAfter:
        - test
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: namespace
            value: openshift-pipelines
          - name: name
            value: buildah
      params:
        - name: IMAGE
          value: $(params.IMAGE_REPOSITORY):$(tasks.clone.results.COMMIT)
        - name: DOCKERFILE
          value: ./container/Containerfile
        - name: CONTEXT
          value: .
        - name: BUILD_ARGS
          value:
            - APP_VERSION=$(params.APP_VERSION)
            - IMAGE_TAG=$(tasks.clone.results.COMMIT)
        - name: STORAGE_DRIVER
          value: vfs
        - name: FORMAT
          value: oci
        - name: TLS_VERIFY
          value: "true"
        - name: SKIP_PUSH
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
    - name: update-gitops
      runAfter:
        - build-and-push
      taskRef:
        name: update-gitops-manifest
      params:
        - name: IMAGE_TAG
          value: $(tasks.clone.results.COMMIT)
        - name: GIT_REPOSITORY_SSH
          value: $(params.GIT_REPOSITORY_SSH)
        - name: GIT_BRANCH
          value: $(params.GIT_BRANCH)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: ssh-credentials
          workspace: git-credentials
  results:
    - name: GIT_COMMIT
      value: $(tasks.clone.results.COMMIT)
    - name: GIT_URL
      value: $(tasks.clone.results.URL)
    - name: IMAGE_URL
      value: $(tasks.build-and-push.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-and-push.results.IMAGE_DIGEST)
    - name: GITOPS_COMMIT
      value: $(tasks.update-gitops.results.GITOPS_COMMIT)
